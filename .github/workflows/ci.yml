name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # NOTE: `pnpm lint` is not wired up (next lint removed in Next 16,
      # eslint not installed). Restore this step once linting is reintroduced.

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      # NOTE: `pnpm build` is intentionally not run here — the Next.js build
      # collects page data from routes that open real DB connections, which
      # would require Turso credentials in CI. Vercel deploy previews already
      # run the build on every PR; duplicating it here adds no coverage.
